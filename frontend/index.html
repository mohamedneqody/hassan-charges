<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Hassan Charges - Live Real-Time Forex Exchange Rates Dashboard with 60+ currency pairs">
    <meta name="theme-color" content="#0a0e17">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Hassan Charges - Live Forex Rates</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Socket.IO Client -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="/css/style.css?v=6">
</head>
<body data-theme="dark">
    <!-- Particles Background -->
    <canvas id="particles-canvas"></canvas>
    <!-- ═══════════ HEADER ═══════════ -->
    <header id="app-header">
        <div class="header-left">
            <div class="logo">
                <span class="logo-icon">💱</span>
                <div class="logo-text">
                    <h1>Hassan Charges</h1>
                    <span class="logo-subtitle">Live Exchange Rates</span>
                </div>
            </div>
        </div>
        <div class="header-center">
            <div class="stats-bar">
                <div class="stat" id="stat-pairs">
                    <span class="stat-value">0</span>
                    <span class="stat-label">Pairs</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat" id="stat-updates">
                    <span class="stat-value">0</span>
                    <span class="stat-label">Updates/s</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat" id="stat-clients">
                    <span class="stat-value">1</span>
                    <span class="stat-label">Online</span>
                </div>
            </div>
        </div>
        <div class="header-right">
            <button id="theme-toggle" class="icon-btn" title="Toggle Theme">
                <span class="icon">🌙</span>
            </button>
            <div class="notification-wrapper">
                <button id="notif-toggle" class="icon-btn" title="Notifications">
                    <span class="icon">🔔</span>
                    <span class="notif-badge" id="notif-badge" style="display:none;">0</span>
                </button>
                <div class="notif-panel" id="notif-panel">
                    <div class="notif-header">Notifications</div>
                    <div class="notif-list" id="notif-list">
                        <div class="empty-notif">No new notifications</div>
                    </div>
                </div>
            </div>
            <button id="audio-toggle" class="icon-btn" title="Toggle Sound">
                <span class="icon">🔇</span>
            </button>
            <div class="connection-status" id="connection-status">
                <span class="status-dot"></span>
                <span class="status-text">Connecting...</span>
            </div>
            <div class="clock" id="clock">--:--:--</div>
        </div>
    </header>

    <!-- ═══════════ MARKET TICKER ═══════════ -->
    <div class="market-ticker">
        <div class="ticker-label">MARKET TRENDS</div>
        <div class="ticker-wrap">
            <div class="ticker-content" id="ticker-content">
                <!-- Ticker items will go here -->
            </div>
        </div>
        <div class="market-sentiment" id="market-sentiment">
            <div class="sentiment-bar">
                <div class="sentiment-bull" id="sentiment-bull" style="width: 50%;"></div>
                <div class="sentiment-bear" id="sentiment-bear" style="width: 50%;"></div>
            </div>
            <span class="sentiment-text">Balancing...</span>
        </div>
    </div>

    <!-- ═══════════ CONTROLS ═══════════ -->
    <div class="controls" id="controls">
        <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
            </svg>
            <input type="search" id="search-input" placeholder="Search currency pair... (e.g. EUR/USD, Egyptian)" autocomplete="off">
        </div>
        <div class="tabs" id="tabs">
            <button class="tab" data-tab="watchlist">
                <span class="tab-icon">⭐</span> Watchlist
                <span class="tab-count" id="count-watchlist">0</span>
            </button>
            <button class="tab active" data-tab="all">
                <span class="tab-icon">🌍</span> All
                <span class="tab-count" id="count-all">0</span>
            </button>
            <button class="tab" data-tab="major">
                <span class="tab-icon">⭐</span> Major
                <span class="tab-count" id="count-major">0</span>
            </button>
            <button class="tab" data-tab="minor">
                <span class="tab-icon">🔄</span> Minor
                <span class="tab-count" id="count-minor">0</span>
            </button>
            <button class="tab" data-tab="exotic">
                <span class="tab-icon">🌴</span> Exotic
                <span class="tab-count" id="count-exotic">0</span>
            </button>
            <button class="tab" data-tab="crypto">
                <span class="tab-icon">₿</span> Crypto
                <span class="tab-count" id="count-crypto">0</span>
            </button>
        </div>
        
        <!-- Live Converter Widget -->
        <div class="converter-widget" id="converter-widget">
            <span class="converter-icon">💱</span>
            <input type="number" id="conv-amount" value="1" min="0" step="any" placeholder="Amount">
            <select id="conv-from"></select>
            <span class="conv-arrow">➞</span>
            <select id="conv-to"></select>
            <div class="conv-result" id="conv-result">--</div>
        </div>
    </div>

    <!-- ═══════════ MAIN GRID ═══════════ -->
    <main class="grid-container" id="grid-container">
        <div class="grid" id="currency-grid">
            <!-- Cards generated by JavaScript -->
        </div>
        <div class="empty-state" id="empty-state" style="display:none;">
            <span class="empty-icon">🔍</span>
            <p>No currency pairs found</p>
        </div>
    </main>

    <!-- ═══════════ FOOTER ═══════════ -->
    <footer id="app-footer">
        <div class="footer-left">
            <span class="footer-badge">DEMO MODE</span>
            <span>Simulated real-time data • Updates every 1s</span>
        </div>
        <div class="footer-right">
            <span>Built with FastAPI + Socket.IO</span>
            <span class="footer-dot">•</span>
            <span>© 2026 Hassan Charges</span>
        </div>
    </footer>

    <script src="/js/app.js?v=6"></script>
</body>
</html>
